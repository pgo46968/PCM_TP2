<!doctype html>
<!-- Declaração do tipo de documento, indicando que se trata de um documento HTML5 -->
<html lang="en">

  <!-- Cabeçalho do documento: contém metadados, o título e a importação de estilos externos (Bootstrap, estilos e ícons, e CSS personalizado) -->
  <head>

    <!-- Define a codificação de caracteres (utf-8) e a responsividade da página para dispositivos móveis --> 
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Ligação para o Bootstrap CSS para estilizar os elementos da página -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Ligação para os ícones do Bootstrap (fontes de ícones) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Ligação para a folha de estilos personalizada específica para o jogo Blackjack -->
    <link rel="stylesheet" href="css/blackjack_style.css" />

    <!-- Título da página, que fica visível no separador do navegador -->
    <title>Blackjack</title>
  </head>

  <!-- Área principal do conteúdo da página, onde estão os elementos visíveis para o utilizador -->
  <body>

    <!-- Cabeçalho da página: contém o título do jogo -->
    <header class="container">
      <h1>Blackjack 25</h1>
    </header>

    <!-- Contentor principal onde o jogo acontece -->
    <main class="container">
      
      <!-- Secção principal do jogo -->
      <section id="game">
        
        <!-- Área do Dealer -->
        <div class="game-participant mb-4">
          <!-- Título-->
          <h2>Dealer</h2>
          <div class="cards-wrapper">
            <!-- Zona das Cartas do Dealer -->
            <div id="dealer" class="cards-container"></div>
            <!-- Zona da Pontuação e Ícone de Resultado do Dealer -->
            <div class="stats-container">
              <span id="dealer-score" class="score-text">0</span>
              <span id="dealer-icon" class="result-icon"></span>
            </div>
          </div>
        </div>

        <!-- Área do Jogador (Player) -->
        <div class="game-participant mb-4">
          <h2>Player</h2>
          <div class="cards-wrapper">
            <!-- Zona das Cartas do Jogador -->
            <div id="player" class="cards-container"></div>
            <!-- Zona da Pontuação e Ícone de Resultado do Jogador -->
            <div class="stats-container">
              <span id="player-score" class="score-text">0</span>
              <span id="player-icon" class="result-icon"></span>
            </div>
          </div>
        </div>

        <!-- Botão para o jogador pedir uma nova carta -->
        <button
          class="btn btn-primary"
          id="card"
          type="button"
          onclick="playerNewCard()"
        >
          Card
        </button>

        <!-- Botão para o jogador parar (terminar o seu turno) -->
        <button
          class="btn btn-secondary"
          id="stand"
          type="button"
          onclick="dealerFinish()"
        >
          Stop
        </button>

        <!-- Botão para iniciar um novo jogo, que começa desativado (disabled) -->
        <button
          class="btn btn-success"
          id="new_game"
          type="button"
          onclick="newGame()"
          disabled
        >
          New Game
        </button>
      </section>

      <!-- Secção reservada para exibir o estado do jogo e as respetivas mensagens -->
      <section id="game_status">
        <!-- Este conteúdo será preenchido dinamicamente via JavaScript durante o jogo -->
      </section>

      <!-- Secção de depuração (debug) para os programadores verem o estado interno do jogo (atualmente comentada/inativa) -->
      <!--
      <section id="sec_debug">
        <h2>Debug</h2> 
        <p id="debug">
          Espaço reservado para exibir informações de depuração
        </p>
      </section>
      -->
    </main>

    <!-- Secção de rodapé (footer), atualmente vazia -->
    <footer class="container">
      <!-- Qualquer conteúdo de rodapé pode ser adicionado aqui no futuro -->
    </footer>

    <!-- Ligação ao pacote JavaScript do Bootstrap para garantir o funcionamento de componentes interativos -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Ligação ao ficheiro JavaScript que contém a lógica base orientada a objetos do jogo Blackjack -->
    <script src="js/blackjack_object.js"></script>

    <!-- Ligação ao ficheiro JavaScript responsável por gerir as interações (cliques) e a interface do jogo -->
    <script src="js/blackjack_manager.js"></script>

    <!-- Script inline para iniciar o jogo automaticamente assim que a janela é carregada -->
    <script>
      window.onload = newGame; // Inicializa um novo jogo ao carregar a página
    </script>
  </body>
</html>
